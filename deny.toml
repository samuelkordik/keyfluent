# cargo-deny configuration. Keyfluent is MIT-licensed; every dependency must be compatible.
[graph]
all-features = false
# Desktop targets Keyfluent ships (wasm-only dependencies such as wasm-bindgen-futures -> tokio
# are never built).
targets = [
  "x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu",
  "aarch64-apple-darwin", "x86_64-apple-darwin",
  "x86_64-pc-windows-gnu", "x86_64-pc-windows-msvc",
]

[licenses]
confidence-threshold = 0.9
allow = [
  "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause", "BSD-3-Clause", "ISC", "Zlib", "0BSD",
  "Unicode-3.0", "BSL-1.0",
  # Fonts bundled by egui (permissive, attribution required — to be listed in third-party notices):
  "OFL-1.1", "Ubuntu-font-1.0",
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true
# Keyfluent must never talk to the network: no HTTP/TLS/socket runtimes, telemetry or crash
# reporters may enter the dependency tree (any target). `cargo deny check bans` enforces it.
deny = [
  { crate = "reqwest" }, { crate = "hyper" }, { crate = "h2" }, { crate = "h3" }, { crate = "ureq" },
  { crate = "isahc" }, { crate = "curl" }, { crate = "curl-sys" }, { crate = "attohttpc" }, { crate = "surf" },
  { crate = "http-body" }, { crate = "tungstenite" }, { crate = "quinn" }, { crate = "trust-dns-resolver" },
  { crate = "hickory-resolver" }, { crate = "native-tls" }, { crate = "openssl" }, { crate = "openssl-sys" },
  { crate = "rustls" }, { crate = "tokio" }, { crate = "socket2" }, { crate = "sentry" }, { crate = "minidumper" },
  { crate = "crash-handler" }, { crate = "opentelemetry" }, { crate = "env_logger" }, { crate = "tracing-subscriber" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"

[advisories]
# Unmaintained-crate notices are reviewed manually rather than failing the build.
unmaintained = "workspace"
