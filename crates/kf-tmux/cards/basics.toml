# tmux Basics: panes and windows. Every card is tested content
# (crates/kf-tmux/tests/cards.rs): its canonical keys must reach its goal from
# its start fixture, and its prefix key must be the stock tmux 3.4 binding.

# --- Panes ---------------------------------------------------------------

[[card]]
id = "split-h"
category = "panes"
intent = "Split this pane side by side"
teach = "Press the prefix, Ctrl-b, let go, then press %. Think of % as two circles side by side."
start = "one-pane"
goal = { panes = 2, split = "h" }
canonical = ["C-b %"]

[[card]]
id = "split-v"
category = "panes"
intent = "Split this pane into top and bottom"
teach = 'Press Ctrl-b, let go, then press ". Think of the two marks in " as one pane stacked over another.'
start = "one-pane"
goal = { panes = 2, split = "v" }
canonical = ['C-b "']

[[card]]
id = "pane-left"
category = "panes"
intent = "Move to the pane on the left"
teach = "Press Ctrl-b, let go, then press the Left arrow key."
start = "two-panes-h"
goal = { active_pane = 0 }
canonical = ["C-b Left"]

[[card]]
id = "pane-right"
category = "panes"
intent = "Move to the pane on the right"
teach = "Press Ctrl-b, let go, then press the Right arrow key."
start = "two-panes-h-first"
goal = { active_pane = 1 }
canonical = ["C-b Right"]

[[card]]
id = "pane-up"
category = "panes"
intent = "Move to the pane above"
teach = "Press Ctrl-b, let go, then press the Up arrow key."
start = "two-panes-v"
goal = { active_pane = 0 }
canonical = ["C-b Up"]

[[card]]
id = "pane-down"
category = "panes"
intent = "Move to the pane below"
teach = "Press Ctrl-b, let go, then press the Down arrow key."
start = "two-panes-v-first"
goal = { active_pane = 1 }
canonical = ["C-b Down"]

[[card]]
id = "pane-next"
category = "panes"
intent = "Move to the next pane"
teach = "Press Ctrl-b, let go, then press o. Each press moves you on to the next pane in turn."
start = "four-panes"
goal = { active_pane = 0 }
canonical = ["C-b o"]

[[card]]
id = "pane-last"
category = "panes"
intent = "Jump back to the pane you were just in"
teach = "Press Ctrl-b, let go, then press ; (semicolon). It takes you back to the pane you used before this one."
start = "four-panes"
goal = { active_pane = 0 }
canonical = ["C-b ;"]

[[card]]
id = "pane-zoom"
category = "panes"
intent = "Make this pane fill the window"
teach = "Press Ctrl-b, let go, then press z for zoom. Do the same again to shrink it back."
start = "four-panes"
goal = { zoomed = true }
canonical = ["C-b z"]

[[card]]
id = "pane-kill"
category = "panes"
intent = "Close this pane"
teach = "Press Ctrl-b, let go, then press x. tmux asks if you are sure: press y for yes."
start = "two-panes-h"
goal = { panes = 1 }
canonical = ["C-b x", "y"]

# --- Windows -------------------------------------------------------------

[[card]]
id = "window-new"
category = "windows"
intent = "Open a new window"
teach = "Press Ctrl-b, let go, then press c for create. The new window shows up in the bar at the bottom."
start = "one-pane"
goal = { windows = 2, current_window = 1 }
canonical = ["C-b c"]

[[card]]
id = "window-next"
category = "windows"
intent = "Go to the next window"
teach = "Press Ctrl-b, let go, then press n for next."
start = "three-windows"
goal = { current_window = 2 }
canonical = ["C-b n"]

[[card]]
id = "window-prev"
category = "windows"
intent = "Go to the previous window"
teach = "Press Ctrl-b, let go, then press p for previous."
start = "three-windows"
goal = { current_window = 0 }
canonical = ["C-b p"]

[[card]]
id = "window-select"
category = "windows"
intent = "Go to window 2"
teach = "Press Ctrl-b, let go, then press the window's number, here 2. The numbers are in the bar at the bottom."
start = "three-windows"
goal = { current_window = 2 }
canonical = ["C-b 2"]

[[card]]
id = "window-last"
category = "windows"
intent = "Jump back to the window you were just in"
teach = "Press Ctrl-b, let go, then press l for last. It takes you back to the window you used before this one."
start = "three-windows"
goal = { current_window = 0 }
canonical = ["C-b l"]

[[card]]
id = "window-rename"
category = "windows"
intent = "Rename this window to logs"
teach = "Press Ctrl-b, let go, then press , (comma). Press Ctrl-u to clear the old name, type the new one and press Enter."
start = "one-pane"
goal = { window_name = "logs" }
canonical = ["C-b ,", "C-u", { text = "logs" }, "Enter"]

[[card]]
id = "window-kill"
category = "windows"
intent = "Close this window"
teach = "Press Ctrl-b, let go, then press &. tmux asks if you are sure: press y for yes."
start = "three-windows"
goal = { windows = 2 }
canonical = ["C-b &", "y"]
